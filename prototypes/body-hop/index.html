<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body Hop</title>
<style>
  :root { --bg: #1d1f24; --panel: #2a2d34; --text: #e8e8ea; --dim: #9a9ca3; --accent: #f0d060; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
  #app { max-width: 960px; margin: 0 auto; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  #turns { color: var(--dim); font-variant-numeric: tabular-nums; }
  #hint { min-height: 1.4em; margin: 8px 0; color: var(--dim); }
  #stage { position: relative; display: flex; justify-content: center; margin: 12px 0; }
  canvas { background: #000; border-radius: 6px; max-width: 100%; image-rendering: pixelated; }
  #status { min-height: 1.4em; text-align: center; font-weight: 600; }
  #status.bad { color: #ff9a8a; } #status.good { color: var(--accent); }
  /* While the touch pad is shown it sits right under the status line, so the line always keeps two
     lines of room: a one-line message and a two-line one (a hop or a Blocked line wraps on a 360 px
     phone) take the same space and the pad never jumps. Every status line fits in two lines at 360 px. */
  body.touch #status { min-height: 2.8em; }
  @media (pointer: coarse) { body:not(.no-touch) #status { min-height: 2.8em; } }
  /* The body label never wraps and is as wide for every body, so a hop never moves the turn counter
     or the board (each line fits beside the counter at 360 px). */
  #body { display: inline-block; padding: 2px 8px; border-radius: 4px; background: var(--panel); white-space: nowrap; min-width: 12em; text-align: center; }
  #turns { white-space: nowrap; }
  footer { color: var(--dim); font-size: 13px; margin-top: 10px; }
  kbd { background: var(--panel); border-radius: 3px; padding: 0 5px; font: 12px ui-monospace, monospace; }
  #levels { display: flex; gap: 6px 14px; flex-wrap: wrap; margin-top: 8px; }
  #levels .chapter { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  #levels .chapter span { color: var(--dim); font-size: 12px; margin-right: 2px; }
  #levels button { background: var(--panel); color: var(--dim); border: 1px solid #3a3e46; border-radius: 4px; padding: 2px 8px; cursor: pointer; font: inherit; font-size: 13px; }
  #levels button.cur { color: var(--text); border-color: var(--accent); }
  /* Touch controls: shown on touch screens, or on demand with the "Touch controls" button. */
  #touch { display: none; margin: 12px auto 0; max-width: 360px; gap: 12px; align-items: center; justify-content: space-between; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  body.touch #touch { display: flex; }
  @media (pointer: coarse) { body:not(.no-touch) #touch { display: flex; } }
  #pad { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); gap: 6px; }
  #pad button, #acts button { background: var(--panel); color: var(--text); border: 1px solid #3a3e46; border-radius: 10px; font: 600 22px system-ui, sans-serif; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #pad button:active, #acts button:active { background: #3a3e46; }
  #pad [data-dir="up"] { grid-area: 1 / 2; } #pad [data-dir="left"] { grid-area: 2 / 1; }
  #pad [data-dir="right"] { grid-area: 2 / 3; } #pad [data-dir="down"] { grid-area: 3 / 2; }
  #acts { display: flex; flex-direction: column; gap: 8px; }
  #acts button { font-size: 15px; padding: 12px 16px; min-width: 112px; }
  #acts button:disabled { opacity: 0.4; }
  #touchToggle { background: none; border: 1px solid #3a3e46; color: var(--dim); border-radius: 4px; padding: 2px 8px; font: inherit; font-size: 13px; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Legend: an overlay on the board, opened and closed with L (or the Legend button). It is never
     taller than the board, or 200 px on a tiny board, and never more than 40 px past the board, so it
     can cover the status line but never the touch pad. Longer content scrolls inside it. */
  #legend { display: none; position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 5; width: min(620px, 100%); box-sizing: border-box; max-height: min(calc(100% + 40px), max(100%, 200px)); overflow-y: auto; overscroll-behavior: contain; padding: 0 12px 8px; background: rgba(10,10,14,0.97); border: 1px solid #3a3e46; border-radius: 6px; font-size: 12.5px; line-height: 1.3; cursor: pointer; }
  #legend.open { display: block; }
  #legend .top { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0 4px; background: rgb(10,10,14); }
  #legend .top b { font-size: 13px; }
  #legend .top span { color: var(--dim); font-weight: 400; }
  #legend button { background: var(--panel); color: var(--text); border: 1px solid #3a3e46; border-radius: 4px; padding: 2px 10px; font: inherit; cursor: pointer; }
  #legend .who { margin: 6px 0 1px; font-weight: 600; }
  #legend .row { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; margin-left: 6px; }
  #legend .row .lbl { color: var(--dim); min-width: 44px; }
  #legend .row.list { flex-direction: column; align-items: flex-start; }
  #legend .item { display: inline-flex; align-items: center; gap: 3px; }
  #legend canvas { width: 32px; height: 32px; border-radius: 2px; background: none; flex: none; outline: 1px solid #3a3e46; }
  #legend canvas.mark { width: 40px; height: 40px; }
  #legend p { margin: 6px 0 0; color: var(--dim); }
  #legendBtn, #sfxBtn, #musicBtn { background: none; border: 1px solid #3a3e46; color: var(--dim); border-radius: 4px; padding: 2px 8px; font: inherit; font-size: 13px; cursor: pointer; }
  #levels button.done::after { content: " ✓"; color: var(--accent); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">Body Hop</h1>
    <div><span id="body">spirit</span> <span id="turns"></span></div>
  </header>
  <div id="hint"></div>
  <div id="stage"><canvas id="c"></canvas><div id="legend" role="dialog" aria-label="Legend"></div></div>
  <div id="status"></div>
  <div id="touch">
    <div id="pad">
      <button id="btnUp" data-dir="up" aria-label="Up">&#9650;</button>
      <button id="btnLeft" data-dir="left" aria-label="Left">&#9664;</button>
      <button id="btnRight" data-dir="right" aria-label="Right">&#9654;</button>
      <button id="btnDown" data-dir="down" aria-label="Down">&#9660;</button>
    </div>
    <div id="acts">
      <button id="btnUndo">Undo</button>
      <button id="btnRestart">Restart</button>
      <button id="btnNext" disabled>Next level</button>
    </div>
  </div>
  <div id="levels"></div>
  <footer>
    <kbd>←↑→↓</kbd>/<kbd>WASD</kbd> move, or walk into a body to hop into it ·
    <kbd>Z</kbd>/<kbd>Backspace</kbd> undo · <kbd>R</kbd> restart · <kbd>N</kbd> next level (after a win) · <kbd>Shift+N</kbd> skip ·
    <button id="legendBtn"><kbd>L</kbd> legend</button> · <button id="touchToggle">Touch controls</button> ·
    <button id="sfxBtn">Sound on</button> · <button id="musicBtn"><kbd>M</kbd> Music on</button>
  </footer>
</div>
<script src="engine.js"></script>
<script src="levels.js"></script>
<script src="audio.js"></script>
<script src="pixel-art.js"></script>
<script>
"use strict";
const BH = window.BodyHop, LEVELS = window.BODY_HOP_LEVELS, SND = window.BodyHopAudio;
const PX = window.PixelArt, SCALE = 4, TILE = PX.K * SCALE; // 16 px art scaled 4x
const cv = document.getElementById("c");
const $ = (id) => document.getElementById(id);

let idx = 0, L, s, history, turns, startTime, log, won, flash = null;
const done = new Set();
try { for (const n of JSON.parse(localStorage.getItem("bodyhop-done") || "[]")) done.add(n); } catch (e) { /* storage unavailable */ }

// `cue` is the sound for this load: the level-start chime, or the rewind sweep on a restart.
function load(i, cue = "start") {
  idx = (i + LEVELS.length) % LEVELS.length;
  L = BH.parse(LEVELS[idx]);
  s = L.start; history = []; turns = 0; won = false; log = []; startTime = performance.now();
  cv.width = L.w * TILE; cv.height = L.h * TILE;
  $("title").textContent = `${label(idx)}. ${LEVELS[idx].name}`;
  $("hint").textContent = LEVELS[idx].hint || "";
  setStatus("");
  renderLevels(); draw(); hud();
  SND.levelChange(); SND.setBody("S"); SND.play(cue);
}

function setStatus(text, cls) { const el = $("status"); el.textContent = text; el.className = cls || ""; }

function hud() {
  $("btnNext").disabled = !won;
  const me = BH.current(L, s);
  const sees = me.t === "G" ? "sees red, not blue" : me.t === "C" ? "sees blue, not red" : "sees no colour";
  $("body").textContent = `${BH.NAMES[me.t]}: ${sees}`;
  $("body").style.color = me.t === "G" ? "#ff9a8a" : me.t === "C" ? "#9ac0ff" : "#ddd";
  const par = LEVELS[idx].par;
  $("turns").textContent = `turns ${turns}` + (par ? ` · par ${par}` : "");
}

// Levels are grouped by their `chapter` field; a level without one joins the group before it.
// A chapter whose name starts with "Night shift" is optional and shown last, numbered X1, X2, ...
const chapterOf = (i) => { for (let j = i; j >= 0; j--) if (LEVELS[j].chapter) return LEVELS[j].chapter; return ""; };
const isBonus = (i) => /^Night shift/.test(chapterOf(i));
const mainCount = LEVELS.filter((_, i) => !isBonus(i)).length;
const label = (i) => isBonus(i) ? `X${i - mainCount + 1}` : String(i + 1);

function renderLevels() {
  const box = $("levels"); box.innerHTML = "";
  let group = null, name = null;
  LEVELS.forEach((lv, i) => {
    if (chapterOf(i) !== name || !group) {
      name = chapterOf(i);
      group = document.createElement("div"); group.className = "chapter";
      if (name) { const t = document.createElement("span"); t.textContent = name; group.appendChild(t); }
      box.appendChild(group);
    }
    const b = document.createElement("button");
    b.textContent = label(i); b.title = lv.name;
    if (i === idx) b.className = "cur";
    if (done.has(lv.name)) b.classList.add("done");
    // On the current level the button only restarts it (nothing, at turn 0).
    b.onclick = () => { SND.play("ui"); if (closeLegend(i !== idx ? `Legend closed. Press again to go to level ${label(i)}.` : history.length ? "Legend closed. Press again to restart." : "Legend closed.")) return; logEnd("left"); load(i); };
    group.appendChild(b);
  });
}

// What the win line says after the score: the next level, a chapter end, or the end of the main game.
function winNext() {
  const last = idx === LEVELS.length - 1, endMain = idx === mainCount - 1;
  if (endMain) return mainCount < LEVELS.length
    ? " That's the main game. Want more? Press N for Night shift."
    : " That's the whole game. Thanks for playing!";
  if (last) return " That's every Night shift level. Thanks for playing!";
  if (chapterOf(idx + 1) !== chapterOf(idx)) return ` Chapter complete: ${chapterOf(idx)}. Press N for ${chapterOf(idx + 1)}.`;
  return " Press N or tap Next level.";
}

function logEnd(how) {
  if (!log.length && how !== "complete") return;
  const secs = ((performance.now() - startTime) / 1000).toFixed(1);
  const par = LEVELS[idx].par;
  console.log(`Level ${idx + 1} ${how} | turns ${turns} (par ${par}) | time ${secs} s | undos ${log.filter((x) => x === "Z").length} | keys ${compress(log)}`);
}
function compress(a) { const out = []; for (const k of a) { const last = out[out.length - 1]; if (last && last[0] === k) last[1]++; else out.push([k, 1]); } return out.map(([k, n]) => n > 1 ? `${k}x${n}` : k).join(" "); }

function act(dir) {
  if (closeLegend(!won ? "Legend closed. Press again to move." : idx < LEVELS.length - 1 ? "Legend closed. Press N for the next level." : "Legend closed.")) return;
  if (won) return;
  const r = BH.step(L, s, dir);
  log.push(dir[0].toUpperCase());
  if (!r.state) { setStatus(r.why, "bad"); flash = { t: performance.now(), dir }; draw(); SND.play("blocked"); return; }
  history.push(s); s = r.state; turns++;
  // A hop says which body you are in now, and whether you have been in it before, so an
  // accidental hop back into a parked body is never silent.
  if (r.kind === "hop") {
    const name = BH.NAMES[BH.current(L, s).t];
    const again = history.some((h) => h.ctrl === s.ctrl);
    SND.play(`hop:${BH.current(L, s).t}${again ? ":back" : ""}`); SND.setBody(BH.current(L, s).t);
    setStatus((again ? `Back in the ${name}.` : `You are the ${name} now.`) + " Z to undo.");
  } else { setStatus(walkNews(history[history.length - 1], s)); walkSounds(history[history.length - 1], s); }
  if (BH.won(L, s)) {
    won = true; done.add(LEVELS[idx].name);
    try { localStorage.setItem("bodyhop-done", JSON.stringify([...done])); } catch (e) { /* ignore */ }
    const par = LEVELS[idx].par;
    setStatus(`Out in ${turns} turns${par ? (turns <= par ? " (par!)" : ` (par ${par})`) : ""}.${winNext()}`, "good");
    logEnd("complete"); renderLevels(); SND.play("win");
  }
  hud(); draw();
}

// The sounds of a walk: the step of the body that walked, plus at most one extra, the most specific
// thing it changed (gate change > plate > unseen block), never a pile-up.
function walkSounds(prev, now) {
  const me = BH.current(L, now), from = BH.current(L, prev), tile = L.tiles[me.y][me.x];
  SND.play("step:" + me.t);
  const gates = L.tiles.some((row) => row.includes("|"));
  const was = BH.gateOpen(L, prev), is = BH.gateOpen(L, now);
  if (gates && !was && is) return SND.play("gate-open");
  if (gates && was && !is) return SND.play("gate-shut");
  if (tile === "_") return SND.play(me.t === "S" ? "plate-ghost" : "plate-down");
  if (L.tiles[from.y][from.x] === "_" && me.t !== "S") return SND.play("plate-up");
  if (tile === { C: "R", G: "B" }[me.t]) SND.play("shimmer");
}

// What a walk changed about plates and gates, or "" (which clears the status line, as before).
// A hop never moves a body, so it never changes a plate or a gate, and a refused ("Blocked:") press
// changes nothing: these lines can't coincide with a hop line or a Blocked line. Only the win line,
// set after this, replaces one. Priority: gate change > doorstop > spirit on a plate > unseen block.
// The last two can't coincide (the spirit never stands on a block).
function walkNews(prev, now) {
  const gates = L.tiles.flat().filter((c) => c === "|").length;
  const was = BH.gateOpen(L, prev), is = BH.gateOpen(L, now);
  const the = gates > 1 ? "The gates" : "The gate";
  if (gates && !was && is) return gates > 1 ? "The gates open." : "The gate opens.";
  if (gates && was && !is) return gates > 1 ? "The gates shut: no body on a plate or in a gate." : "The gate shuts: no body on a plate or in a gate.";
  if (gates && is && BH.platesHeld(L, prev) && !BH.platesHeld(L, now))
    return `No body on a plate, but a body standing in a gate holds ${the.toLowerCase()} open.`;
  const me = BH.current(L, now);
  if (me.t === "S" && L.tiles[me.y][me.x] === "_") return "You weigh nothing: the plate stays up.";
  // A body walked onto a block of the colour it can't see (the cat into red, the guard into blue).
  const unseen = { C: "R", G: "B" }[me.t];
  if (unseen && L.tiles[me.y][me.x] === unseen) {
    const col = unseen === "R" ? "red" : "blue";
    return `The ${BH.NAMES[me.t]} can't see ${col}: the ${col} block isn't there for it.`;
  }
  return "";
}

function undo() {
  if (closeLegend(history.length ? "Legend closed. Press again to undo." : "Legend closed.")) return;
  log.push("Z");
  if (!history.length) return;
  SND.play("undo");
  s = history.pop(); turns--; won = false; setStatus("");
  const after = BH.current(L, s).t;
  SND.setBody(after);
  hud(); draw();
}

// ---------- drawing: 8-bit art from pixel-art.js ----------
// The drawing never changes the game. Each frame it compares the game state with the one it last saw and
// animates the difference: a walk slides one tile with stepping legs, a hop sends a spark to the new body and
// repaints the world in four steps, plates sink, gate bars slide, a refused press nudges the body and blinks
// the tile it hit, a win sinks the body down the exit stairs.
const WALK_MS = 160, HOP_MS = 350;
const anim = { L: null, seen: null, won: false, wonAt: 0, walks: new Map(), facing: new Map(), hop: null, gate: 0, plates: new Map(), last: 0 };

const entPos = (st, i) => i < 0 ? [st.sx, st.sy] : st.pos[i];
function noteChange(now) {
  if (anim.L !== L) { // a new level or a restart: show it as it is, no tweens
    Object.assign(anim, { L, seen: s, won, hop: null, gate: BH.gateOpen(L, s) ? 1 : 0, map: L.tiles.map((r) => r.join("")) });
    anim.walks.clear(); anim.facing.clear(); anim.plates.clear();
    return;
  }
  if (anim.seen === s) return;
  const prev = anim.seen; anim.seen = s;
  // Draw the settled picture too, in case the browser is not running animation frames (a hidden tab).
  for (const ms of [WALK_MS + 40, 700, 1300]) setTimeout(() => draw(), ms);
  const ents = s.pos.map((_, i) => i); if (s.ctrl < 0 && prev.ctrl < 0) ents.push(-1);
  for (const i of ents) {
    const [ax, ay] = entPos(prev, i), [bx, by] = entPos(s, i);
    if (ax !== bx || ay !== by) { anim.walks.set(i, { ax, ay, bx, by, t0: now }); if (ax !== bx) anim.facing.set(i, bx < ax); }
  }
  if (prev.ctrl !== s.ctrl) { const a = BH.current(L, prev), b = BH.current(L, s); anim.hop = { ax: a.x, ay: a.y, bx: b.x, by: b.y, from: a.t, to: b.t, t0: now }; }
  if (won && !anim.won) anim.wonAt = now;
  anim.won = won;
}

function draw(now = performance.now()) {
  if (!L) return;
  noteChange(now);
  // Event handlers draw with performance.now(), animation frames with a frame time that can be a little
  // earlier, so the clock only moves forward.
  const dt = Math.max(0, now - (anim.last || now)); anim.last = Math.max(anim.last, now);
  const me = BH.current(L, s), K = PX.K, PAL = PX.PAL;
  const hop = anim.hop && now - anim.hop.t0 < HOP_MS ? anim.hop : null, k = hop ? (now - hop.t0) / HOP_MS : 1;
  const landed = anim.hop && !hop ? now - anim.hop.t0 - HOP_MS : Infinity;
  const fl = flash && now - flash.t < 300 ? flash : null, fdt = fl ? now - fl.t : 0;
  const [ndx, ndy] = fl ? BH.DIRS[fl.dir] : [0, 0], nudge = fl && fdt < 120 ? Math.round(Math.sin(Math.PI * fdt / 120) * 2) : 0;
  const sinkT = won ? now - anim.wonAt - WALK_MS : -1, sink = sinkT > 0 ? Math.min(16, Math.floor(sinkT / 30)) : 0;
  const idle = Math.floor(now / 450) % 2, bodies = [];
  const place = (i, t, x, y, o) => {
    const w = anim.walks.get(i); let px = x, py = y, frame = 0, lift = o.active && !won ? idle : 0;
    if (w) { const p = PX.walk(now, w.t0, 0, 1, WALK_MS); px = w.ax + (w.bx - w.ax) * p.pos; py = w.ay + (w.by - w.ay) * p.pos; frame = p.moving ? 1 : 0; lift = p.lift; if (p.pos >= 1) anim.walks.delete(i); }
    if (t === "S") frame = Math.floor(now / 250) % 2;
    bodies.push({ t, x: px, y: py, frame, lift, flip: anim.facing.get(i), ...o });
  };
  s.pos.forEach(([x, y], i) => {
    const mine = i === s.ctrl, active = mine && !hop;
    // The second, third... body of one kind gets its own collar (cat) or badge (guard) colour.
    const nth = L.types.slice(0, i).filter((u) => u === L.types[i]).length, mark = nth ? (L.types[i] === "C" ? ["#f8a4c0", "#fcfcfc", "#58d854"] : ["#fcfcfc", "#f8a4c0", "#58d854"])[(nth - 1) % 3] : undefined;
    place(i, L.types[i], x, y, { active, zz: !mine, mark,
      dx: mine ? ndx * nudge : 0, dy: mine ? ndy * nudge : 0, sink: mine ? sink : 0,
      squash: mine && landed < 160 ? (landed < 60 ? 0.7 : landed < 110 ? 1.1 : 1) : 1 });
  });
  if (s.ctrl < 0) place(-1, "S", s.sx, s.sy, { active: true, dx: ndx * nudge, dy: ndy * nudge, sink });
  // Hop markers on every edge between you and a body next to you.
  const hops = won || hop ? [] : Object.entries(BH.DIRS).filter(([, [dx, dy]]) => BH.bodyAt(s, me.x + dx, me.y + dy) >= 0).map(([dir]) => [me.x, me.y, dir]);
  // Plates sink when a body has arrived on them; the gates follow once every walk has landed.
  const onTile = (x, y) => bodies.some((b) => b.t !== "S" && Math.abs(b.x - x) < 0.3 && Math.abs(b.y - y) < 0.3);
  const gateTo = BH.gateOpen(L, s) ? 1 : 0;
  // Finished walks are dropped here, not only when drawn: the spirit's last walk is never drawn again once it hops.
  for (const [i, w] of anim.walks) if (now - w.t0 >= WALK_MS) anim.walks.delete(i);
  if (!anim.walks.size) anim.gate = gateTo ? Math.min(1, anim.gate + dt / 300) : Math.max(0, anim.gate - dt / 120);
  const state = (x, y) => {
    const c = L.tiles[y][x];
    if (c === "|") return { open: Math.floor(anim.gate * 6) / 6, lit: anim.gate > 0.5 };
    if (c !== "_") return null;
    const key = x + "," + y, v = anim.plates.get(key) || 0, to = onTile(x, y) ? 1 : 0;
    const nv = to ? Math.min(1, v + dt / 80) : Math.max(0, v - dt / 80); anim.plates.set(key, nv);
    return { press: nv };
  };
  const fx = (q) => {
    if (hop) { // the spark: arcs from the body you left to the one you enter, trailing gold
      const at = (kk) => [hop.ax * K + 8 + (hop.bx - hop.ax) * K * kk, hop.ay * K + 8 + (hop.by - hop.ay) * K * kk - Math.sin(Math.PI * kk) * 12];
      for (let i = 3; i > 0; i--) { const [x, y] = at(Math.max(0, k - i * 0.09)); PX.dot(q, x, y, i === 1 ? PAL.y : PAL.Y); }
      const [x, y] = at(k); PX.dot(q, x - 1, y - 1, PAL.W, 2); for (const [dx, dy] of [[-2, 0], [2, 0], [0, -2], [0, 2]]) PX.dot(q, x + dx, y + dy, PAL.Y);
    } else if (landed < 200) { const r = 4 + landed / 25; for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1], [-0.7, -0.7], [0.7, -0.7]]) PX.dot(q, me.x * K + 8 + dx * r, me.y * K + 8 + dy * r, landed < 100 ? PAL.W : PAL.Y); }
    if (fl) { // a refused press: the tile you pushed against blinks red, a puff of dust at your feet
      if (Math.floor(fdt / 75) % 2 === 0) { q.strokeStyle = PAL.R; q.lineWidth = 1; q.strokeRect((me.x + ndx) * K + 0.5, (me.y + ndy) * K + 0.5, K - 1, K - 1); }
      if (fdt >= 40 && fdt < 220) { const sp = 2 + fdt / 50; PX.dot(q, me.x * K + 8 - sp, me.y * K + 15 - fdt / 80, PAL.L); PX.dot(q, me.x * K + 8 + sp, me.y * K + 15 - fdt / 80, PAL.L); }
    }
    if (sinkT > 480 && sinkT < 980) { // the win: a flash on the exit and a ring of light
      const d = sinkT - 480; if (d < 80) { q.fillStyle = PAL.W; q.fillRect(me.x * K, me.y * K, K, K); }
      const r = 6 + d / 18; for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; PX.dot(q, me.x * K + 8 + Math.cos(a) * r, me.y * K + 8 + Math.sin(a) * r, i % 2 ? PAL.Y : PAL.W); }
    }
  };
  PX.render(cv, { map: anim.map, viewer: hop ? (k < 0.5 ? hop.from : hop.to) : me.t, from: hop ? hop.from : me.t, to: hop ? hop.to : me.t, lensT: k, t: now, bodies, hops, state, fx });
}
const loop = (now) => { draw(now); requestAnimationFrame(loop); };
requestAnimationFrame(loop);

// ---------- legend ----------
// An HTML overlay on the board. Each body's rows draw the tiles exactly as that body sees them.
const LEGEND_BODIES = [
  { t: "S", title: "Spirit (white ghost): sees no colour, so every red or blue block is grey fog, a wall to the spirit; weighs nothing on plates",
    can: [[".", "floor"], ["_", "plate"], ["E", "exit"], ["|o", "open gate"]],
    cannot: [["R", "red block (fog)"], ["B", "blue block (fog)"], ["#", "wall"], ["|", "shut gate"]] },
  { t: "G", title: "Guard (red uniform): sees red, not blue",
    can: [["B", "blue block: not there for the guard"]], also: "floor, plates, open gates, exit",
    cannot: [["R", "red block"], ["#", "wall"], ["|", "shut gate"]] },
  { t: "C", title: "Cat (blue): sees blue, not red",
    can: [["R", "red block: not there for the cat"]], also: "floor, plates, open gates, exit",
    cannot: [["B", "blue block"], ["#", "wall"], ["|", "shut gate"]] },
];
// [tile, text, the body whose view the icon shows (default: the spirit's)]
const LEGEND_TILES = [["#", "wall (bricks): no body passes"],
  ["R", "red block (stripes): solid to the guard, not there for the cat", "G"],
  ["B", "blue block (dots): solid to the cat, not there for the guard", "C"],
  ["_", "plate (grey, with a ring): step a body on it. The spirit weighs nothing"],
  ["_h", "plate, held (lit green, glowing round the body on it): every gate is open"],
  ["|", "gate, shut (bars down, red lamps): no body on a plate or in a gate"],
  ["|o", "gate, open (bars up, green lamps): while any plate is held, or a body stands in any gate"],
  ["E", "exit (green EXIT sign over a lit door): reach it to win"]];
// Board markers. "@x" items draw a marker icon instead of a tile.
const LEGEND_MARKS = [["@you", "yellow outline and ring: the body you are in"],
  ["@sleep", "z: an asleep body. It blocks the way"],
  ["@hop", "yellow arrow on your edge: step that way to hop into the body there"]];
let legendOpen = false;

// "|o" draws an open gate and "|" a shut one; "_h" a held plate and "_" an empty one.
function tileIcon(ch, who) {
  const c = document.createElement("canvas"); c.width = c.height = PX.K * 2;
  const open = ch.startsWith("|o"), held = ch.startsWith("_h");
  PX.render(c, { map: [ch[0]], viewer: who, t: 0, state: () => ch[0] === "|" ? { open: open ? 1 : 0, lit: open } : ch[0] === "_" ? { press: held ? 1 : 0 } : null });
  return c;
}

// A marker icon for the legend: a guard on floor, drawn as the board draws it.
function markerIcon(kind) {
  const c = document.createElement("canvas"), wide = kind === "hop"; c.width = PX.K * (wide ? 4 : 2); c.height = PX.K * 2; c.className = "mark";
  if (wide) c.style.width = "80px";
  PX.render(c, { map: [wide ? ".." : "."], viewer: "S", t: 0, bodies: [{ t: "G", x: wide ? 1 : 0, y: 0, active: kind === "you", zz: kind !== "you" }], hops: wide ? [[0, 0, "right"]] : [] });
  return c;
}

function legendRow(label, items, who, also) {
  const row = document.createElement("div"); row.className = "row";
  if (label) { const head = document.createElement("span"); head.className = "lbl"; head.textContent = label; row.appendChild(head); }
  else row.classList.add("list");
  for (const [ch, name, view] of items) {
    const it = document.createElement("span"); it.className = "item";
    it.appendChild(ch[0] === "@" ? markerIcon(ch.slice(1)) : tileIcon(ch, view || who)); it.appendChild(document.createTextNode(name)); row.appendChild(it);
  }
  if (also) { const a = document.createElement("span"); a.textContent = "and " + also; row.appendChild(a); }
  return row;
}

function buildLegend() {
  const box = $("legend"); box.innerHTML = "";
  const top = document.createElement("div"); top.className = "top";
  const h = document.createElement("b"); h.textContent = "Legend ";
  const how = document.createElement("span"); how.textContent = "tap or L closes"; h.appendChild(how);
  const close = document.createElement("button"); close.textContent = "Close";
  top.append(h, close); box.appendChild(top); // a click anywhere on the panel closes it, the button included
  for (const b of LEGEND_BODIES) {
    const who = document.createElement("div"); who.className = "who"; who.textContent = b.title;
    who.style.color = b.t === "G" ? "#ff9a8a" : b.t === "C" ? "#9ac0ff" : "#ddd";
    box.append(who, legendRow("Can:", b.can, b.t, b.also), legendRow("Can't:", b.cannot, b.t));
  }
  const tw = document.createElement("div"); tw.className = "who"; tw.textContent = "Special tiles";
  box.append(tw, legendRow("", LEGEND_TILES, "S"));
  const mk = document.createElement("div"); mk.className = "who"; mk.textContent = "Bodies on the board";
  box.append(mk, legendRow("", LEGEND_MARKS, "S"));
  const p = document.createElement("p");
  p.textContent = "Each tile is drawn as that body sees it: a dotted outline is not there for that body. " +
    "Walk into a body to hop into it; Z undoes a hop.";
  box.appendChild(p);
}

function toggleLegend(open = !legendOpen) {
  if (open !== legendOpen) SND.play("ui");
  legendOpen = open;
  const box = $("legend");
  if (open) buildLegend();
  box.classList.toggle("open", open);
  if (open) { // say so when the panel is shorter than its content (overlay scrollbars are easy to miss)
    box.scrollTop = 0;
    box.querySelector(".top span").textContent = (box.scrollHeight > box.clientHeight + 2 ? "scroll for more · " : "") + "tap or L closes";
  }
}

// While the legend is open, every game input (move, undo, restart, next, skip, level button) only
// closes it, so nothing happens on a board you cannot see. The status line then says so (`msg`), so a
// press that did nothing on the board is never silent. Returns true if it closed the legend.
function closeLegend(msg) {
  if (!legendOpen) return false;
  toggleLegend(false);
  setStatus(msg || "Legend closed.");
  return true;
}

// At turn 0 a restart changes nothing on the board, so the close message promises nothing.
function restart() { if (closeLegend(history.length ? "Legend closed. Press again to restart." : "Legend closed.")) return; logEnd("restarted"); log.push("R"); load(idx, "restart"); }
function next() { if (closeLegend(won && idx < LEVELS.length - 1 ? "Legend closed. Press again for the next level." : "Legend closed.")) return; if (won && idx < LEVELS.length - 1) load(idx + 1); }

// On-screen controls. pointerdown (not click) so taps feel instant and double-tap never zooms.
for (const b of document.querySelectorAll("#pad button")) {
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); act(b.dataset.dir); });
}
$("btnUndo").addEventListener("pointerdown", (e) => { e.preventDefault(); undo(); });
$("btnRestart").addEventListener("pointerdown", (e) => { e.preventDefault(); restart(); });
$("btnNext").addEventListener("pointerdown", (e) => { e.preventDefault(); next(); });
$("legendBtn").addEventListener("click", () => toggleLegend());
// A click or tap anywhere on the legend closes it, except on its scrollbar (a drag there scrolls it).
$("legend").addEventListener("click", (e) => {
  const box = e.currentTarget, r = box.getBoundingClientRect();
  if (e.clientX > r.left + box.clientLeft + box.clientWidth) return;
  toggleLegend(false);
});
$("touchToggle").addEventListener("click", () => {
  const coarse = matchMedia("(pointer: coarse)").matches;
  const shown = document.body.classList.contains("touch") || (coarse && !document.body.classList.contains("no-touch"));
  document.body.classList.toggle("touch", !shown);
  document.body.classList.toggle("no-touch", shown);
});
// Sound and music switches (saved on this machine). M toggles music; it is not a game input, so it
// never closes the legend.
function soundButtons() {
  $("sfxBtn").textContent = `Sound ${SND.sfx ? "on" : "off"}`;
  $("musicBtn").innerHTML = `<kbd>M</kbd> Music ${SND.music ? "on" : "off"}`;
}
function toggleMusic() { SND.setMusic(!SND.music); SND.play("ui"); soundButtons(); }
$("sfxBtn").addEventListener("click", () => { SND.setSfx(!SND.sfx); SND.play("ui"); soundButtons(); });
$("musicBtn").addEventListener("click", toggleMusic);
soundButtons();

const KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right" };
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (KEYS[e.key]) { e.preventDefault(); act(KEYS[e.key]); return; }
  if (e.key === "z" || e.key === "Z" || e.key === "Backspace") { e.preventDefault(); undo(); return; }
  if (e.key === "r" || e.key === "R") { restart(); return; }
  if (e.key === "N" && e.shiftKey) { if (closeLegend("Legend closed. Press again to skip this level.")) return; logEnd("SKIPPED"); load(idx + 1); return; }
  if (e.key === "n") { next(); return; }
  if (e.key === "l" || e.key === "L") { toggleLegend(); return; }
  if (e.key === "m" || e.key === "M") { toggleMusic(); return; }
});

const q = Number(new URLSearchParams(location.search).get("level"));
load(q > 0 ? q - 1 : 0);
window.__bodyhop = { get state() { return s; }, get level() { return idx; }, get won() { return won; }, get turns() { return turns; } };
</script>
</body>
</html>

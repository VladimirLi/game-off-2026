<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body Hop</title>
<style>
  /* The game is one pixel-art canvas (hud.js), centred in the window and scaled by whole numbers; the title and end
     screens (screens.js) are another, over it. The text the canvas shows is also kept in a visually hidden block
     (#sr) for screen readers and the test tools, pinned to the top-left so it cannot make the page scroll. */
  html, body { margin: 0; height: 100%; background: #06060c; color: #ececf8; font: 15px/1.4 system-ui, sans-serif; }
  #app { min-height: 100%; display: flex; align-items: center; justify-content: center; }
  /* Hidden until hud.js has sized it, so the page never shows (and then moves) a canvas of the default size. */
  #c { display: block; visibility: hidden; image-rendering: pixelated; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .sr { position: absolute; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Title and end screens (screens.js): one pixel-art canvas over the game, scaled by whole numbers. */
  #screen { display: none; position: fixed; inset: 0; z-index: 20; background: #06060c; align-items: center; justify-content: center; animation: screen-in 0.3s ease-out; }
  #screen.open { display: flex; }
  #screen.leaving { opacity: 0; transition: opacity 0.25s ease-in; }
  #screen canvas { display: block; background: none; border-radius: 0; max-width: 100%; image-rendering: pixelated; touch-action: manipulation; }
  @keyframes screen-in { from { opacity: 0; } to { opacity: 1; } }
  /* Feedback: a plain form over the game, drawn to match the pixel panels. */
  #feedback { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(4,4,12,0.85); }
  #feedback[hidden] { display: none; }
  #feedback form { width: min(92vw, 520px); box-sizing: border-box; padding: 18px; background: #12122a; border: 4px solid #06060c; box-shadow: inset 0 0 0 2px #40406c; font: 16px/1.4 ui-monospace, monospace; color: #ececf8; }
  #feedback h2 { margin: 0 0 8px; font-size: 20px; color: #f8c838; letter-spacing: 1px; text-transform: uppercase; }
  #feedback p { margin: 0 0 10px; color: #a8a8c8; }
  #feedback textarea { width: 100%; box-sizing: border-box; min-height: 7em; padding: 8px; background: #06060c; color: #ececf8; border: 2px solid #40406c; font: inherit; resize: vertical; }
  #feedback .row { display: flex; gap: 10px; justify-content: flex-end; margin: 12px 0 8px; }
  #feedback button { padding: 8px 16px; font: 700 15px ui-monospace, monospace; letter-spacing: 1px; text-transform: uppercase; border: 3px solid #06060c; background: #34345a; color: #ececf8; cursor: pointer; }
  #feedback button[type="submit"] { background: #f8c838; color: #06060c; }
  #feedback button:focus-visible, #feedback textarea:focus-visible { outline: 2px solid #f8c838; outline-offset: 2px; }
</style>
</head>
<body>
<div id="app">
  <canvas id="c" role="img" aria-label="Body Hop board"></canvas>
</div>
<div id="sr" class="sr">
  <h1 id="title">Body Hop</h1>
  <p id="hint"></p>
  <p><span id="body">spirit</span> <span id="turns"></span></p>
  <p id="status" aria-live="polite"></p>
  <p>Arrow keys or WASD move; walking into a body hops into it. Z undo, R restart, N next level after a win, L how to play, Escape menu, M music.</p>
</div>
<div id="levels" hidden></div>
<div id="screen" role="dialog" aria-label="Body Hop"><canvas id="screenArt"></canvas></div>
<div id="feedback" role="dialog" aria-label="Send feedback" hidden>
  <form>
    <h2>Send feedback</h2>
    <p>How did it feel? Anything confusing, too easy, too hard or broken?</p>
    <textarea id="fbText" maxlength="1000" aria-label="Your note"></textarea>
    <div class="row"><button type="button" id="fbCancel">Cancel</button><button type="submit" id="fbSend">Send</button></div>
    <p id="fbNote"></p>
  </form>
</div>
<script src="engine.js"></script>
<script src="levels.js"></script>
<script src="audio.js"></script>
<script src="pixel-art.js"></script>
<script src="screens.js"></script>
<script src="hud.js"></script>
<script src="analytics.js"></script>
<script>
"use strict";
const BH = window.BodyHop, LEVELS = window.BODY_HOP_LEVELS, SND = window.BodyHopAudio;
const PX = window.PixelArt, HUD = window.BodyHopHUD, AN = window.BodyHopAnalytics;
const cv = document.getElementById("c"); // the whole game screen (hud.js draws it)
const boardCv = document.createElement("canvas"); // the board at 1x, drawn by pixel-art.js and framed by the HUD
const $ = (id) => document.getElementById(id);

let idx = 0, L, s, history, turns, startTime, log, won, flash = null, status = { text: "", cls: "", at: 0 }, started = false;
const done = new Set();
try { for (const n of JSON.parse(localStorage.getItem("bodyhop-done") || "[]")) done.add(n); } catch (e) { /* storage unavailable */ }

// `cue` is the sound for this load: the level-start chime, or the rewind sweep on a restart.
function load(i, cue = "start") {
  idx = (i + LEVELS.length) % LEVELS.length;
  L = BH.parse(LEVELS[idx]);
  s = L.start; history = []; turns = 0; won = false; log = []; startTime = performance.now();
  boardCv.width = L.w * PX.K; boardCv.height = L.h * PX.K;
  $("title").textContent = `${label(idx)}. ${LEVELS[idx].name}`;
  $("hint").textContent = LEVELS[idx].hint || "";
  setStatus("");
  renderLevels(); stale(); hud(); prewarmLooks();
  SND.levelChange(); SND.setBody("S"); SND.play(cue);
  if (cue !== "restart") HUD.intro(performance.now(), introInfo(idx));
  if (started) AN.track("level_start", { level: label(idx), index: idx + 1, name: LEVELS[idx].name, chapter: chapterOf(idx), restart: cue === "restart" });
}

// In idle time after a level starts, draw ahead each body's look of the room and the looks every hop passes through
// (PX.prewarm), so no hop stops to draw them. A newer level cancels the rest.
let warmJob = 0;
function prewarmLooks() {
  const map = L.tiles.map((r) => r.join("")), types = [...new Set(["S", ...L.types])], jobs = [];
  for (const a of types) for (const b of types) if (a === b || b !== "S") jobs.push([a, b]); // nobody hops into the spirit
  const job = ++warmJob, idle = window.requestIdleCallback || ((f) => setTimeout(f, 50));
  const next = () => { if (job !== warmJob || !jobs.length) return; PX.prewarm(map, ...jobs.shift()); idle(next); };
  idle(next);
}

// What the intro ribbon says: the chapter, the level's number and its name.
function introInfo(i) {
  const ch = chapterOf(i), n = [...new Set(LEVELS.map((_, j) => chapterOf(j)))].indexOf(ch) + 1;
  return { label: isBonus(i) ? `Night shift ${i - mainCount + 1} of ${LEVELS.length - mainCount}` : `Level ${i + 1} of ${mainCount}`, name: LEVELS[i].name,
    chapter: isBonus(i) ? "Night shift: bonus levels" : `Chapter ${n}: ${ch}` };
}

function setStatus(text, cls) { const el = $("status"); el.textContent = text; el.className = cls || ""; status = { text, cls: cls || "", at: performance.now() }; stale(); }

function hud() {
  const me = BH.current(L, s);
  const sees = me.t === "G" ? "sees red, not blue" : me.t === "C" ? "sees blue, not red" : "sees no colour";
  $("body").textContent = `${BH.NAMES[me.t]}: ${sees}`;
  $("body").style.color = me.t === "G" ? "#ff9a8a" : me.t === "C" ? "#9ac0ff" : "#ddd";
  const par = LEVELS[idx].par;
  $("turns").textContent = `turns ${turns}` + (par ? ` · par ${par}` : "");
}

// Levels are grouped by their `chapter` field; a level without one joins the group before it.
// A chapter whose name starts with "Night shift" is optional and shown last, numbered X1, X2, ...
const chapterOf = (i) => { for (let j = i; j >= 0; j--) if (LEVELS[j].chapter) return LEVELS[j].chapter; return ""; };
const isBonus = (i) => /^Night shift/.test(chapterOf(i));
const mainCount = LEVELS.filter((_, i) => !isBonus(i)).length;
const label = (i) => isBonus(i) ? `X${i - mainCount + 1}` : String(i + 1);

function renderLevels() {
  const box = $("levels"); box.innerHTML = "";
  let group = null, name = null;
  LEVELS.forEach((lv, i) => {
    if (chapterOf(i) !== name || !group) {
      name = chapterOf(i);
      group = document.createElement("div"); group.className = "chapter";
      if (name) { const t = document.createElement("span"); t.textContent = name; group.appendChild(t); }
      box.appendChild(group);
    }
    const b = document.createElement("button");
    b.textContent = label(i); b.title = lv.name;
    if (i === idx) b.className = "cur";
    if (done.has(lv.name)) b.classList.add("done");
    // On the current level the button only restarts it (nothing, at turn 0).
    b.onclick = () => { SND.play("ui"); if (closeLegend(i !== idx ? `Closed How to play. Press again to go to level ${label(i)}.` : history.length ? "Closed How to play. Press again to restart." : "Closed How to play.")) return; logEnd("left"); load(i); };
    group.appendChild(b);
  });
}

// What the win line says after the score: the next level, a chapter end, or the end of the main game.
function winNext() {
  const last = idx === LEVELS.length - 1, endMain = idx === mainCount - 1;
  const go = touchUI() ? "Tap NEXT" : "Press N";
  if (endMain) return mainCount < LEVELS.length ? ` That's the main game! ${go}.` : ` That's the whole game! ${go}.`;
  if (last) return ` That's every Night shift level! ${go}.`;
  if (chapterOf(idx + 1) !== chapterOf(idx)) return ` Chapter complete: ${chapterOf(idx)}. ${go} for ${chapterOf(idx + 1)}.`;
  return touchUI() ? " Tap NEXT." : " Press N or Enter.";
}
// A touch screen (no mouse to hover) gets the pad and buttons, so its messages name buttons, not keys.
const touchUI = () => matchMedia("(hover: none) and (pointer: coarse)").matches;

function logEnd(how) {
  if (!log.length && how !== "complete") return;
  const secs = ((performance.now() - startTime) / 1000).toFixed(1);
  const par = LEVELS[idx].par;
  console.log(`Level ${idx + 1} ${how} | turns ${turns} (par ${par}) | time ${secs} s | undos ${log.filter((x) => x === "Z").length} | keys ${compress(log)}`);
  AN.track("level_end", { level: label(idx), index: idx + 1, name: LEVELS[idx].name, outcome: how.toLowerCase(), turns, par, at_par: how === "complete" && turns <= par,
    secs: +secs, undos: log.filter((x) => x === "Z").length, keys: compress(log).slice(0, 600) }); // a restart ends the attempt with outcome "restarted"
}
function compress(a) { const out = []; for (const k of a) { const last = out[out.length - 1]; if (last && last[0] === k) last[1]++; else out.push([k, 1]); } return out.map(([k, n]) => n > 1 ? `${k}x${n}` : k).join(" "); }

function act(dir) {
  if (closeLegend(!won ? "Closed How to play. Press again to move." : idx < LEVELS.length - 1 ? "Closed How to play. Press N for the next level." : "Closed How to play.")) return;
  if (won) return;
  const r = BH.step(L, s, dir);
  log.push(dir[0].toUpperCase());
  if (!r.state) { setStatus(r.why, "bad"); flash = { t: performance.now(), dir }; stale(); SND.play("blocked"); return; }
  history.push(s); s = r.state; turns++;
  // A hop says which body you are in now, and whether you have been in it before, so an
  // accidental hop back into a parked body is never silent.
  if (r.kind === "hop") {
    const name = BH.NAMES[BH.current(L, s).t];
    const again = history.some((h) => h.ctrl === s.ctrl);
    SND.play(`hop:${BH.current(L, s).t}${again ? ":back" : ""}`); SND.setBody(BH.current(L, s).t);
    setStatus((again ? `Back in the ${name}.` : `You are the ${name} now.`) + (touchUI() ? "" : " Z to undo."));
  } else { setStatus(walkNews(history[history.length - 1], s)); walkSounds(history[history.length - 1], s); }
  if (BH.won(L, s)) {
    won = true; done.add(LEVELS[idx].name);
    try { localStorage.setItem("bodyhop-done", JSON.stringify([...done])); } catch (e) { /* ignore */ }
    if (!(best[LEVELS[idx].name] <= turns)) { best[LEVELS[idx].name] = turns; try { localStorage.setItem("bodyhop-best", JSON.stringify(best)); } catch (e) { /* ignore */ } }
    const par = LEVELS[idx].par;
    setStatus(`Out in ${turns} turns${par ? (turns <= par ? " (par!)" : ` (par ${par})`) : ""}.${winNext()}`, "good");
    logEnd("complete"); renderLevels(); SND.play("win");
  }
  hud(); noteChange(performance.now()); stale(); // tweens start from the key press; the next animation frame draws them
}

// The sounds of a walk: the step of the body that walked, plus at most one extra, the most specific
// thing it changed (gate change > plate > unseen block), never a pile-up.
function walkSounds(prev, now) {
  const me = BH.current(L, now), from = BH.current(L, prev), tile = L.tiles[me.y][me.x];
  SND.play("step:" + me.t);
  const gates = L.tiles.some((row) => row.includes("|"));
  const was = BH.gateOpen(L, prev), is = BH.gateOpen(L, now);
  if (gates && !was && is) return SND.play("gate-open");
  if (gates && was && !is) return SND.play("gate-shut");
  if (tile === "_") return SND.play(me.t === "S" ? "plate-ghost" : "plate-down");
  if (L.tiles[from.y][from.x] === "_" && me.t !== "S") return SND.play("plate-up");
  if (tile === { C: "R", G: "B" }[me.t]) SND.play("shimmer");
}

// What a walk changed about plates and gates, or "" (which clears the status line, as before).
// A hop never moves a body, so it never changes a plate or a gate, and a refused ("Blocked:") press
// changes nothing: these lines can't coincide with a hop line or a Blocked line. Only the win line,
// set after this, replaces one. Priority: gate change > doorstop > spirit on a plate > unseen block.
// The last two can't coincide (the spirit never stands on a block).
function walkNews(prev, now) {
  const gates = L.tiles.flat().filter((c) => c === "|").length;
  const was = BH.gateOpen(L, prev), is = BH.gateOpen(L, now);
  const the = gates > 1 ? "The gates" : "The gate";
  if (gates && !was && is) return gates > 1 ? "The gates open." : "The gate opens.";
  if (gates && was && !is) return gates > 1 ? "The gates shut: no body on a plate or in a gate." : "The gate shuts: no body on a plate or in a gate.";
  if (gates && is && BH.platesHeld(L, prev) && !BH.platesHeld(L, now))
    return `No body on a plate, but a body standing in a gate holds ${the.toLowerCase()} open.`;
  const me = BH.current(L, now);
  if (me.t === "S" && L.tiles[me.y][me.x] === "_") return "You weigh nothing: the plate stays up.";
  // A body walked onto a block of the colour it can't see (the cat into red, the guard into blue).
  const unseen = { C: "R", G: "B" }[me.t];
  if (unseen && L.tiles[me.y][me.x] === unseen) {
    const col = unseen === "R" ? "red" : "blue";
    return `The ${BH.NAMES[me.t]} can't see ${col}: the ${col} block isn't there for it.`;
  }
  return "";
}

function undo() {
  if (closeLegend(history.length ? "Closed How to play. Press again to undo." : "Closed How to play.")) return;
  log.push("Z");
  if (!history.length) { setStatus("Nothing to undo: this is the start."); return; }
  SND.play("undo");
  const was = s.ctrl;
  s = history.pop(); turns--; won = false;
  const after = BH.current(L, s).t;
  setStatus(s.ctrl !== was ? `Undone: you are the ${BH.NAMES[after]} again.` : `Undone: back to turn ${turns}.`);
  SND.setBody(after);
  hud(); noteChange(performance.now()); stale();
}

// ---------- drawing: 8-bit art from pixel-art.js ----------
// The drawing never changes the game. Each frame it compares the game state with the one it last saw and
// animates the difference: a walk slides one tile with stepping legs, a hop sends a spark to the new body and
// repaints the world in four steps, plates sink, gate bars slide, a refused press nudges the body, bumps the board
// and blinks the tile it hit, a win sinks the body down the exit stairs and throws confetti. With the system's
// "reduce motion" setting (PixelArt.calm) nothing shakes, squashes, nudges, flashes or blinks; the rest still shows.
const WALK_MS = 160, HOP_MS = 350;
const anim = { L: null, seen: null, won: false, wonAt: 0, walks: new Map(), facing: new Map(), hop: null, gate: 0, plates: new Map(), last: 0 };

const entPos = (st, i) => i < 0 ? [st.sx, st.sy] : st.pos[i];
function noteChange(now) {
  if (anim.L !== L) { // a new level or a restart: show it as it is, no tweens
    Object.assign(anim, { L, seen: s, won, hop: null, gate: BH.gateOpen(L, s) ? 1 : 0, map: L.tiles.map((r) => r.join("")) });
    anim.walks.clear(); anim.facing.clear(); anim.plates.clear();
    return;
  }
  if (anim.seen === s) return;
  const prev = anim.seen; anim.seen = s;
  // A hidden tab runs no animation frames: draw the settled picture too.
  for (const ms of [WALK_MS + 40, 700, 1300]) setTimeout(() => { if (document.hidden) draw(); }, ms);
  const ents = s.pos.map((_, i) => i); if (s.ctrl < 0 && prev.ctrl < 0) ents.push(-1);
  for (const i of ents) {
    const [ax, ay] = entPos(prev, i), [bx, by] = entPos(s, i);
    if (ax !== bx || ay !== by) { anim.walks.set(i, { ax, ay, bx, by, t0: now }); if (ax !== bx) anim.facing.set(i, bx < ax); }
  }
  if (prev.ctrl !== s.ctrl) { const a = BH.current(L, prev), b = BH.current(L, s); anim.hop = { ax: a.x, ay: a.y, bx: b.x, by: b.y, from: a.t, to: b.t, fromI: prev.ctrl, t0: now }; }
  if (won && !anim.won) anim.wonAt = now;
  anim.won = won;
}

// The picture is drawn only when it changes: draw() asks PX.clock when anything it drew next moves (a walk or a hop
// moves every frame; blinking and marching patterns step every few hundred ms). Between those times the loop sleeps
// on a timer and asks for no animation frames, unless an input or a status change marks the picture stale.
let needDraw = true, frameAsked = 0, sleepTimer = 0;
function wake() { clearTimeout(sleepTimer); if (!frameAsked) frameAsked = requestAnimationFrame(loop); }
function stale() { needDraw = true; if (document.hidden) draw(); else wake(); } // a hidden tab runs no animation frames
for (const ev of ["keydown", "keyup", "pointerdown", "pointerup", "pointermove", "pointerleave", "resize", "visibilitychange"]) addEventListener(ev, stale, true);
// clip: redraw only these rects of the screen (from PX.clock.dirty), or everything when it is missing.
function draw(now = performance.now(), clip) {
  if (!L) return;
  PX.clock.begin(); needDraw = false;
  noteChange(now);
  // Event handlers draw with performance.now(), animation frames with a frame time that can be a little
  // earlier, so the clock only moves forward. After the loop has slept, plates and gates step at most 100 ms.
  const dt = Math.min(100, Math.max(0, now - (anim.last || now))); anim.last = Math.max(anim.last, now);
  const me = BH.current(L, s), K = PX.K, PAL = PX.PAL, still = PX.calm();
  const hop = anim.hop && now - anim.hop.t0 < HOP_MS ? anim.hop : null, k = hop ? (now - hop.t0) / HOP_MS : 1;
  const landed = anim.hop && !hop ? now - anim.hop.t0 - HOP_MS : Infinity;
  const fl = flash && now - flash.t < 300 ? flash : null, fdt = fl ? now - fl.t : 0;
  const [ndx, ndy] = fl ? BH.DIRS[fl.dir] : [0, 0], nudge = fl && fdt < 120 && !still ? Math.round(Math.sin(Math.PI * fdt / 120) * 2) : 0;
  const sinkT = won ? now - anim.wonAt - WALK_MS : -1, sink = sinkT > 0 ? Math.min(16, Math.floor(sinkT / 30)) : 0;
  const bodies = [], walking = anim.walks.size > 0; // a walk's last frame differs from the next
  const [bx, by] = HUD.boardAt(boardCv.width, boardCv.height); // where the board sits on the screen
  const place = (i, t, x, y, o) => {
    const w = anim.walks.get(i), r = [bx + Math.round(x * K) - 2, by + Math.round(y * K) - 4, 20, 22]; // the sprite at rest: lift, outline, ring
    let px = x, py = y, frame = 0, lift = o.active && !won ? PX.clock.step(now, 450, r) % 2 : 0;
    if (w) { const p = PX.walk(now, w.t0, 0, 1, WALK_MS); px = w.ax + (w.bx - w.ax) * p.pos; py = w.ay + (w.by - w.ay) * p.pos; frame = p.moving ? 1 : 0; lift = p.lift; if (p.pos >= 1) anim.walks.delete(i); }
    if (t === "S") frame = PX.clock.step(now, 250, r) % 2;
    bodies.push({ t, x: px, y: py, frame, lift, flip: anim.facing.get(i), ...o });
  };
  // A hop crouches the body you leave as the spark leaves it, and squashes the one you land in.
  const leaving = hop && !still && hop.fromI >= 0 ? now - hop.t0 : Infinity;
  s.pos.forEach(([x, y], i) => {
    const mine = i === s.ctrl, active = mine && !hop;
    // The second, third... body of one kind gets its own collar (cat) or badge (guard) colour.
    const nth = L.types.slice(0, i).filter((u) => u === L.types[i]).length, mark = nth ? (L.types[i] === "C" ? ["#f8a4c0", "#fcfcfc", "#58d854"] : ["#fcfcfc", "#f8a4c0", "#58d854"])[(nth - 1) % 3] : undefined;
    const crouch = i === (hop && hop.fromI) && leaving < 130 ? (leaving < 70 ? 0.75 : 1.12) : 1;
    place(i, L.types[i], x, y, { active, zz: !mine, mark,
      dx: mine ? ndx * nudge : 0, dy: mine ? ndy * nudge : 0, sink: mine ? sink : 0,
      squash: mine && landed < 160 && !still ? (landed < 60 ? 0.7 : landed < 110 ? 1.1 : 1) : crouch });
  });
  if (s.ctrl < 0) place(-1, "S", s.sx, s.sy, { active: true, dx: ndx * nudge, dy: ndy * nudge, sink });
  // Hop markers on every edge between you and a body next to you.
  const hops = won || hop ? [] : Object.entries(BH.DIRS).filter(([, [dx, dy]]) => BH.bodyAt(s, me.x + dx, me.y + dy) >= 0).map(([dir]) => [me.x, me.y, dir]);
  // Plates sink when a body has arrived on them; the gates follow once every walk has landed.
  const onTile = (x, y) => bodies.some((b) => b.t !== "S" && Math.abs(b.x - x) < 0.3 && Math.abs(b.y - y) < 0.3);
  const gateTo = BH.gateOpen(L, s) ? 1 : 0;
  // Finished walks are dropped here, not only when drawn: the spirit's last walk is never drawn again once it hops.
  for (const [i, w] of anim.walks) if (now - w.t0 >= WALK_MS) anim.walks.delete(i);
  if (!anim.walks.size) anim.gate = gateTo ? Math.min(1, anim.gate + dt / 300) : Math.max(0, anim.gate - dt / 120);
  if (hop || landed < 200 || fl || (won && sinkT < 980) || walking || anim.gate !== gateTo) PX.clock.live();
  const state = (x, y) => {
    const c = L.tiles[y][x];
    if (c === "|") return { open: Math.floor(anim.gate * 6) / 6, lit: anim.gate > 0.5 };
    if (c !== "_") return null;
    const key = x + "," + y, v = anim.plates.get(key) || 0, to = onTile(x, y) ? 1 : 0;
    const nv = to ? Math.min(1, v + dt / 80) : Math.max(0, v - dt / 80); anim.plates.set(key, nv);
    if (nv !== to) PX.clock.live();
    return { press: nv };
  };
  const fx = (q) => {
    if (hop) { // the spark: arcs from the body you left to the one you enter, trailing gold
      const at = (kk) => [hop.ax * K + 8 + (hop.bx - hop.ax) * K * kk, hop.ay * K + 8 + (hop.by - hop.ay) * K * kk - Math.sin(Math.PI * kk) * 12];
      for (let i = 3; i > 0; i--) { const [x, y] = at(Math.max(0, k - i * 0.09)); PX.dot(q, x, y, i === 1 ? PAL.y : PAL.Y); }
      const [x, y] = at(k); PX.dot(q, x - 1, y - 1, PAL.W, 2); for (const [dx, dy] of [[-2, 0], [2, 0], [0, -2], [0, 2]]) PX.dot(q, x + dx, y + dy, PAL.Y);
    } else if (landed < 200) { const r = 4 + landed / 25; for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1], [-0.7, -0.7], [0.7, -0.7]]) PX.dot(q, me.x * K + 8 + dx * r, me.y * K + 8 + dy * r, landed < 100 ? PAL.W : PAL.Y); }
    if (fl) { // a refused press: the tile you pushed against blinks red (holds still with reduce motion), a puff of dust at your feet
      if (still || Math.floor(fdt / 75) % 2 === 0) { q.strokeStyle = PAL.R; q.lineWidth = 1; q.strokeRect((me.x + ndx) * K + 0.5, (me.y + ndy) * K + 0.5, K - 1, K - 1); }
      if (fdt >= 40 && fdt < 220) { const sp = 2 + fdt / 50; PX.dot(q, me.x * K + 8 - sp, me.y * K + 15 - fdt / 80, PAL.L); PX.dot(q, me.x * K + 8 + sp, me.y * K + 15 - fdt / 80, PAL.L); }
    }
    if (sinkT > 480 && sinkT < 980) { // the win: a flash on the exit and a ring of light
      const d = sinkT - 480; if (d < 80 && !still) { q.fillStyle = PAL.W; q.fillRect(me.x * K, me.y * K, K, K); }
      const r = 6 + d / 18; for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; PX.dot(q, me.x * K + 8 + Math.cos(a) * r, me.y * K + 8 + Math.sin(a) * r, i % 2 ? PAL.Y : PAL.W); }
    }
  };
  const viewer = hop ? (k < 0.5 ? hop.from : hop.to) : me.t, lv = LEVELS[idx], last = idx === LEVELS.length - 1;
  // The board canvas is redrawn only when a changing rect touches it.
  PX.clock.part("board", [bx, by, boardCv.width, boardCv.height], clip, () => PX.clock.at(bx, by, () => PX.render(boardCv, { map: anim.map, viewer,
    from: hop ? hop.from : me.t, to: hop ? hop.to : me.t, lensT: k, t: now, bodies, hops, state, fx, clip: clip && clip.map((r) => [r[0] - bx, r[1] - by, r[2], r[3]]) })));
  HUD.frame(now, { board: boardCv, me: viewer, label: label(idx), name: lv.name, hint: lv.hint || "", turns, par: lv.par, best: best[lv.name],
    won, wonAt: anim.wonAt, winFlashAt: anim.wonAt + WALK_MS + 480, exit: [me.x, me.y], status, hopLanded: landed, bump: fl ? [ndx, ndy, fdt] : null, legendOpen, endMain: idx === mainCount - 1, last,
    chapter: chapterOf(idx).replace(/ \(optional\)/, ""), chapterEnd: !last && chapterOf(idx + 1) !== chapterOf(idx), nextChapter: last ? "" : chapterOf(idx + 1).replace(/ \(optional\)/, "") }, clip);
}
function loop(now) {
  frameAsked = 0;
  if (SCR.open()) { SCR.draw(now); wake(); return; } // the title and end screens animate all the time
  if (needDraw) draw(now);
  else if (now >= PX.clock.due()) draw(now, PX.clock.dirty(now)); // only the parts that changed
  // Sleep until the next change, then draw it in the next frame; nothing scheduled: sleep until an input.
  const wait = PX.clock.due() - performance.now();
  if (wait <= 0) wake(); else if (wait !== Infinity) sleepTimer = setTimeout(wake, wait);
}
wake();

// ---------- How to play: hud.js draws it over the game while legendOpen ----------
let legendOpen = false;
function toggleLegend(open = !legendOpen) { if (open !== legendOpen) { SND.play("ui"); if (open) AN.track("how_to_play", { level: label(idx), index: idx + 1 }); } legendOpen = open; }

// While How to play is open, every game input (move, undo, restart, next, skip, level button) only
// closes it, so nothing happens on a board you cannot see. The status line then says so (`msg`), so a
// press that did nothing on the board is never silent. Returns true if it closed How to play.
function closeLegend(msg) {
  if (!legendOpen) return false;
  toggleLegend(false);
  setStatus(msg || "Closed How to play.");
  return true;
}

// At turn 0 a restart changes nothing on the board, so the close message promises nothing.
function restart() { if (closeLegend(history.length ? "Closed How to play. Press again to restart." : "Closed How to play.")) return; logEnd("restarted"); log.push("R"); load(idx, "restart"); }
// After the last main level, N opens the end screen; after the last level, the final screen.
function next() {
  if (closeLegend(won ? "Closed How to play. Press again to go on." : "Closed How to play.")) return;
  if (!won) return;
  if (idx === mainCount - 1 || idx === LEVELS.length - 1) showScreen(idx === mainCount - 1 && mainCount < LEVELS.length ? "end" : "final");
  else load(idx + 1);
}

// Sound and music switches (saved on this machine). M toggles music; it is not a game input, so it never closes How to play.
function toggleMusic() { SND.setMusic(!SND.music); SND.play("ui"); }
function toggleSfx() { SND.setSfx(!SND.sfx); SND.play("ui"); }
// A tap or click on the board walks one tile toward that tile (along the longer distance), so the game plays with
// a mouse or a finger too. Taps on the HUD's own buttons are handled (and marked) by hud.js first.
cv.addEventListener("pointerdown", (e) => {
  if (e.defaultPrevented || SCR.open() || HUD.menuOpen() || legendOpen) return;
  const t = HUD.tileAt(e); if (!t) return;
  const me = BH.current(L, s), dx = t[0] - me.x, dy = t[1] - me.y;
  if (!dx && !dy) return;
  e.preventDefault();
  act(Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
});

// ---------- title and end screens (screens.js) ----------
// The title shows on a plain visit (a ?level=N link, as the test tools use, goes straight to that level). The
// end screen shows when you press N (or Next level) after the last main level, the final screen after the last
// Night shift level.
const best = {}; // fewest turns per level name, saved on this machine
try { Object.assign(best, JSON.parse(localStorage.getItem("bodyhop-best") || "{}")); } catch (e) { /* storage unavailable */ }
const firstUnsolved = () => { const i = LEVELS.findIndex((lv) => !done.has(lv.name)); return i < 0 ? 0 : i; };
const SCR = window.BodyHopScreens;
SCR.init({ PX, SND, el: $("screen"), canvas: $("screenArt"), levels: LEVELS, mainCount, label, firstUnsolved, statsOn: () => AN.enabled(),
  progress: () => ({ done, best }), music: () => SND.music, toggleMusic, start: (i) => SCR.leave(() => load(i)) });
function showScreen(kind) { legendOpen = false; HUD.closeMenu(); SCR.show(kind); AN.track("screen", { kind }); }
HUD.init({ PX, SND, canvas: cv, levels: LEVELS, mainCount, label, chapterOf, current: () => idx,
  isDone: (i) => done.has(LEVELS[i].name), atPar: (i) => best[LEVELS[i].name] <= LEVELS[i].par, best: (i) => best[LEVELS[i].name],
  music: () => SND.music, sfx: () => SND.sfx, stats: () => AN.available() ? AN.enabled() : null,
  track: (event, props) => AN.track(event, { level: label(idx), index: idx + 1, ...props }),
  act: (name, arg) => ({ undo, restart, next, move: act, legend: () => toggleLegend(), music: toggleMusic, sound: toggleSfx,
    stats: () => { AN.setEnabled(!AN.enabled()); SND.play("ui"); }, feedback: openFeedback,
    title: () => { SND.play("ui"); logEnd("left"); showScreen("title"); }, level: (i) => { logEnd("left"); load(i); } })[name](arg) });

// ---------- feedback: a note from the player, sent with the play stats (or copied when stats can't be sent) ----------
let feedbackOpen = false;
function openFeedback() {
  feedbackOpen = true; const box = $("feedback"); box.hidden = false;
  $("fbNote").textContent = AN.enabled() ? "Sent anonymously with your play stats." : "Play stats are off, so Send copies your note to paste to the developer.";
  $("fbSend").textContent = AN.enabled() ? "Send" : "Copy";
  $("fbText").value = ""; $("fbText").focus();
}
function closeFeedback() { feedbackOpen = false; $("feedback").hidden = true; cv.focus && cv.focus(); }
$("fbCancel").addEventListener("click", closeFeedback);
$("feedback").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("fbText").value.trim(); if (!text) { closeFeedback(); return; }
  if (AN.enabled()) { AN.track("feedback", { text: text.slice(0, 1000), level: label(idx), turns }); AN.flush(); setStatus("Thanks! Your note was sent.", "good"); }
  else { (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => setStatus("Your note is copied. Paste it to the developer.", "good"), () => setStatus("Couldn't copy the note.", "bad")); }
  closeFeedback();
});

const KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right" };
addEventListener("keydown", (e) => {
  if (feedbackOpen) { if (e.key === "Escape") closeFeedback(); return; } // typing a note never moves the game
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (SCR.open()) { SCR.key(e); return; }
  if (HUD.key(e)) return; // the pause menu and level select take every key while open
  if (e.key === "Escape" || e.key === "p" || e.key === "P") { e.preventDefault(); if (legendOpen) toggleLegend(false); else HUD.openMenu("pause"); return; }
  if (KEYS[e.key]) { e.preventDefault(); act(KEYS[e.key]); return; }
  if (e.key === "z" || e.key === "Z" || e.key === "Backspace") { e.preventDefault(); undo(); return; }
  if (e.key === "r" || e.key === "R") { restart(); return; }
  if (e.key === "N" && e.shiftKey) { if (closeLegend("Closed How to play. Press again to skip this level.")) return; logEnd("SKIPPED"); load(idx + 1); return; }
  if (e.key === "n" || (won && (e.key === "Enter" || e.key === " "))) { e.preventDefault(); next(); return; }
  if (e.key === "l" || e.key === "L") { toggleLegend(); return; }
  if (e.key === "h" || e.key === "H") { HUD.toggleHint(); return; }
  if (e.key === "m" || e.key === "M") { toggleMusic(); return; }
});

const q = Number(new URLSearchParams(location.search).get("level"));
AN.init({ levels: LEVELS.length, start: q > 0 ? "level-link" : "title" });
load(q > 0 ? q - 1 : 0);
started = true; // from here on, loading a level counts as a level start (the startup load sits behind the title)
if (q > 0) AN.track("level_start", { level: label(idx), index: idx + 1, name: LEVELS[idx].name, chapter: chapterOf(idx), restart: false });
if (!(q > 0)) showScreen("title");
// A level left by closing or hiding the page still gets its line.
addEventListener("pagehide", () => { if (!won) logEnd("closed"); AN.flush(); });
window.__bodyhop = { get state() { return s; }, get level() { return idx; }, get won() { return won; }, get turns() { return turns; } };
</script>
</body>
